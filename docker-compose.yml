# MariaDB opcional para el perfil "mariadb" de los tres microservicios.
# Uso:  docker compose up -d
services:
  mariadb:
    image: mariadb:11
    container_name: corpaliv-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: corpaliv
      MARIADB_PASSWORD: corpaliv
    ports:
      - "3306:3306"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
