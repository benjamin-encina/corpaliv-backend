server:
  port: 8083

spring:
  application:
    name: auth-service
  # Perfil por defecto: H2 en archivo (./data), persiste entre reinicios y no requiere instalar nada.
  # Perfil "mariadb": usa MariaDB (ver docker-compose.yml en la raíz del repositorio).
  datasource:
    url: jdbc:h2:file:./data/auth-service;MODE=MariaDB;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false


# El secreto debe ser el MISMO en los tres microservicios (auth firma, los otros verifican).
# Solo desarrollo: en un despliegue real se entrega por variable de entorno JWT_SECRET.
jwt:
  secret: ${JWT_SECRET:corpaliv-clave-demo-solo-para-desarrollo-2026-cambiar}

  expiracion-minutos: 120

# Cuenta de administrador de demostración (se crea al iniciar si no existe).
# Cambiar por variables de entorno fuera del entorno académico.
admin:
  nombre: ${ADMIN_NOMBRE:Administrador CORPALIV}
  correo: ${ADMIN_CORREO:admin@corpaliv.cl}
  clave: ${ADMIN_CLAVE:admin}
